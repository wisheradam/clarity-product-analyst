name: INNOVA Clarity Daily Analytics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"
      timezone: "Asia/Jerusalem"

permissions:
  contents: read

concurrency:
  group: innova-clarity-daily
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Windows timezone to Israel
        shell: powershell
        run: tzutil /s "Israel Standard Time"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        shell: powershell
        run: npm ci

      - name: Restore analytics state
        uses: actions/cache@v4
        with:
          path: |
            data/history
            data/email
          key: clarity-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            clarity-state-${{ runner.os }}-

      - name: Validate required secrets
        shell: powershell
        env:
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          $required = @(
            "CLARITY_API_TOKEN",
            "REPORT_EMAIL_FROM",
            "REPORT_EMAIL_TO",
            "GMAIL_APP_PASSWORD"
          )

          $missing = @()

          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)

            if ([string]::IsNullOrWhiteSpace($value)) {
              $missing += $name
            }
          }

          if ($missing.Count -gt 0) {
            throw "Missing GitHub Actions secrets: $($missing -join ', ')"
          }

          Write-Host "All required secrets are configured."

      - name: Run Clarity daily pipeline
        shell: powershell
        env:
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          powershell.exe `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File ".\scripts\run-daily-local-pipeline.ps1"

      - name: Completion summary
        if: success()
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "GITHUB ACTIONS CLARITY RUN COMPLETE"
          Write-Host "========================================"
          Write-Host "Israel time : $((Get-Date).ToString('yyyy-MM-dd HH:mm:ss'))"
          Write-Host "AI Credits  : 0"
          Write-Host "Email       : sent or safely skipped"
          Write-Host "========================================"
