name: INNOVA Clarity Daily Analytics

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC.
    # Israel is UTC+3 in summer and UTC+2 in winter.
    # We schedule both UTC candidates and use a DST-aware gate below
    # so exactly one scheduled run continues each day.
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"

permissions:
  contents: read

concurrency:
  group: innova-clarity-daily
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Windows timezone to Israel
        shell: powershell
        run: tzutil /s "Israel Standard Time"

      - name: Select the correct Israel 10 AM trigger
        id: schedule_gate
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "run=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Manual run requested: continuing."
            exit 0
          }

          $tz = [System.TimeZoneInfo]::FindSystemTimeZoneById("Israel Standard Time")
          $offset = $tz.GetUtcOffset([DateTime]::UtcNow).TotalHours
          $trigger = "${{ github.event.schedule }}"

          Write-Host "Scheduled trigger : $trigger"
          Write-Host "Israel UTC offset : UTC+$offset"
          Write-Host "Israel local time : $((Get-Date).ToString('yyyy-MM-dd HH:mm:ss'))"

          $correctSummerTrigger = ($trigger -eq "0 7 * * *" -and $offset -eq 3)
          $correctWinterTrigger = ($trigger -eq "0 8 * * *" -and $offset -eq 2)

          if ($correctSummerTrigger -or $correctWinterTrigger) {
            "run=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Correct 10:00 Israel trigger: continuing."
          }
          else {
            "run=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Secondary DST trigger: skipping pipeline."
          }

      - name: Setup Node.js
        if: steps.schedule_gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: steps.schedule_gate.outputs.run == 'true'
        shell: powershell
        run: npm ci

      - name: Restore analytics state
        if: steps.schedule_gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            data/history
            data/email
          key: clarity-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            clarity-state-${{ runner.os }}-

      - name: Validate required secrets
        if: steps.schedule_gate.outputs.run == 'true'
        shell: powershell
        env:
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          $required = @(
            "CLARITY_API_TOKEN",
            "REPORT_EMAIL_FROM",
            "REPORT_EMAIL_TO",
            "GMAIL_APP_PASSWORD"
          )

          $missing = @()

          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)

            if ([string]::IsNullOrWhiteSpace($value)) {
              $missing += $name
            }
          }

          if ($missing.Count -gt 0) {
            throw "Missing GitHub Actions secrets: $($missing -join ', ')"
          }

          Write-Host "All required secrets are configured."

      - name: Run Clarity daily pipeline
        if: steps.schedule_gate.outputs.run == 'true'
        shell: powershell
        env:
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          powershell.exe `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File ".\scripts\run-daily-local-pipeline.ps1"

      - name: Completion summary
        if: steps.schedule_gate.outputs.run == 'true' && success()
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "GITHUB ACTIONS CLARITY RUN COMPLETE"
          Write-Host "========================================"
          Write-Host "Israel time : $((Get-Date).ToString('yyyy-MM-dd HH:mm:ss'))"
          Write-Host "AI Credits  : 0"
          Write-Host "Email       : sent or safely skipped"
          Write-Host "========================================"
